[package]
name = "mediagram"
version = "0.1.1"
description = "Browse, search and tag the media in your Telegram chats."
authors = ["Mediagram"]
license = ""
repository = "https://github.com/try-mediagram/mediagram"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mediagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-localhost = "2"
