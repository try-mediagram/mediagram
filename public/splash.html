<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mediagram</title>
        <!--
            The desktop app's launch window (see src-tauri/src/lib.rs). Plain
            HTML with everything inline: it has to paint before the app bundle
            has even started downloading, so it can depend on nothing.
        -->
        <style>
            :root {
                --brand: #1b92d1;
                --bg: #0b0d10;
                --fg: #f2f4f7;
                --muted: #8a93a3;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #ffffff;
                    --fg: #0b0d10;
                    --muted: #5b6474;
                }
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui,
                    sans-serif;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
            }
            body {
                display: grid;
                place-items: center;
                /* The whole window drags, since it has no title bar. */
                -webkit-app-region: drag;
            }
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
                animation: rise 420ms ease-out both;
            }
            .logo {
                width: 72px;
                height: 72px;
                filter: drop-shadow(0 10px 28px rgb(27 146 209 / 0.35));
            }
            h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: -0.01em;
            }
            p {
                margin: -10px 0 0;
                font-size: 12px;
                color: var(--muted);
            }
            .pulse {
                margin-top: 6px;
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: var(--brand);
                animation: pulse 1.2s ease-out infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.35;
                    transform: scale(0.92);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                main,
                .pulse {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img class="logo" src="/logo.svg" alt="" />
            <h1>Mediagram</h1>
            <p>Connecting to Telegram…</p>
            <div class="pulse" aria-hidden="true"></div>
        </main>
    </body>
</html>
